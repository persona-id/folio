name: _deploy (reusable)

# Shared deploy workflow used by deploy-dev.yaml and deploy-frontier.yaml.
# Sets up GitHub App auth + Tailscale cluster access, runs a Makefile target,
# and shows status. Not triggered directly — only via workflow_call.
on:
  workflow_call:
    inputs:
      make_target:
        description: "Makefile target to run (e.g. deploy-dev, deploy-prod, prod-delete)"
        required: true
        type: string
      ref:
        description: "Git ref to check out (defaults to the triggering ref)"
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub Environment name"
        required: true
        type: string
      url:
        description: "Environment URL"
        required: true
        type: string
      status_namespace:
        description: "Namespace to show status for after the run"
        required: true
        type: string

env:
  CLUSTER: frontier-us-central1
  GH_APP_ID: 2781529

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ secrets.FRONTIER_APP_PRIVATE_KEY }}
          owner: persona-id

      - name: Configure git for private repos
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.FRONTIER_TAILSCALE_OIDC_CLIENT_ID }}
          audience: ${{ secrets.FRONTIER_TAILSCALE_OIDC_AUDIENCE }}
          tags: tag:gha-personaid-frontier

      - name: Configure kubectl via Tailscale
        run: |
          sudo tailscale configure kubeconfig https://${{ env.CLUSTER }}-k8s-api
          mkdir -p $HOME/.kube
          sudo cp /root/.kube/config $HOME/.kube/config
          sudo chown $USER:$USER $HOME/.kube/config

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Cache skaffold
        id: cache-skaffold
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/skaffold
          key: skaffold-linux-v2.17.1

      - name: Install skaffold
        if: steps.cache-skaffold.outputs.cache-hit != 'true'
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/v2.17.1/skaffold-linux-amd64
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/

      - name: Run make ${{ inputs.make_target }}
        run: make ${{ inputs.make_target }}

      - name: Show status
        run: |
          DOMAIN=$(kubectl get domainmapping -n ${{ inputs.status_namespace }} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$DOMAIN" ]; then
            echo "🚀 https://$DOMAIN"
          fi
          kubectl get ksvc -n ${{ inputs.status_namespace }} || true
